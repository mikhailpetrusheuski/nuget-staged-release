name: Stage release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to stage, for example 1.2.0
        required: true

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: nuget-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            11.0.x

      - name: Pack and test from a local feed
        run: ./scripts/verify-local-feed.sh "${{ inputs.version }}"

      - name: Stage NuGet release
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_STAGING_API_KEY }}
        run: ./scripts/stage.sh "${{ github.event.repository.name }}-${{ inputs.version }}-${{ github.run_number }}"
